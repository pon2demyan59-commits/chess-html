<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шахматы — против компьютера</title>
  <link rel="stylesheet" href="css/style.css">\n  <link rel="stylesheet" href="css/puzzles.css">
  <script src="js/game.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game__header">
      <p class="eyebrow">ШАХМАТНАЯ АРЕНА</p>
      <h1>Шахматы</h1>
      <p class="subtitle">Шахматы против компьютера • эффектные взятия</p>
    </header>
    <section class="game__panel" aria-label="Шахматная партия">
      <div class="player player--black"><span class="player__avatar">♚</span><div><strong>Компьютер</strong><small>Чёрные</small></div></div>
      <div id="board" class="board" role="grid" aria-label="Шахматная доска"></div>
      <div class="player player--white"><span class="player__avatar">♔</span><div><strong>Игрок</strong><small>Белые</small></div></div>
      <p id="status" class="status" role="status" aria-live="polite">Возьми белую фигуру и перетащи её.</p>
      <div class="puzzle-actions">\n        <button id="reset" class="reset" type="button">Новая партия</button>\n        <a class="reset puzzle-link" href="puzzles.html">Задачи: мат в 2</a>\n      </div>
    </section>
    <footer>Перетаскивай фигуры мышью или пальцем. Играй против компьютера или тренируй тактику в режиме «Мат в 2».</footer>
  </main>
</body>
</html>
